<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تعیین رمز عبور جدید - خاک و دست</title>
    <link rel="icon" type="image/svg+xml" href="./imges/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/webfont.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="breadcrumb-container">
      <a href="index.html" class="back-home"> خانه </a>
      <span class="breadcrumb"> / تعیین رمز جدید </span>
    </div>

    <main class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <img
              src="./imges/logo-khak-o-dast.webp"
              alt="لوگوی سایت خاک و دست"
            />
          </div>
          <h2>تعیین رمز عبور جدید</h2>
          <p>لطفاً رمز عبور جدید خود را وارد کنید</p>
        </div>

        <form id="reset-form" class="auth-form">
          <!-- فیلد رمز عبور جدید -->
          <div class="form-group">
            <label for="password">رمز عبور جدید</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                class="auth-input"
                placeholder="••••••••"
                required
              />
              <i
                class="fa-solid fa-eye eye-icon-password"
                id="eye-icon-password"
              ></i>
            </div>
            <p class="error-message error-password hidden" id="password-error">
              رمز عبور باید حداقل ۸ کاراکتر شامل حروف بزرگ و کوچک، عدد و علامت
              باشد.
            </p>
          </div>

          <!-- فیلد تکرار رمز عبور جدید -->
          <div class="form-group">
            <label for="confirmPassword">تکرار رمز عبور جدید</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="confirmPassword"
                class="auth-input"
                placeholder="••••••••"
                required
              />
              <!-- آیدی دقیقاً مثل ثبت‌نام -->
              <i
                class="fa-solid fa-eye eye-icon-confirm"
                id="eye-icon-confirm"
              ></i>
            </div>
            <p class="error-message error-confirm hidden" id="confirm-error">
              رمز عبور و تکرار آن یکسان نیستند.
            </p>
          </div>

          <!-- دکمه تغییر رمز -->
          <button type="submit" class="auth-btn" id="submitBtn" disabled>
            تغییر رمز عبور
          </button>
        </form>
      </div>
    </main>

    <!-- ================= MODAL ================= -->
    <div class="modal-screen hidden" id="modalScreen">
      <div class="modal-content">
        <img src="" alt="status" id="iconModalScreen" />
        <p class="modal-text" id="ModalText"></p>
        <button class="modal-btn" id="modalButton">تایید</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/reset-password.js"></script>
  </body>
</html>
