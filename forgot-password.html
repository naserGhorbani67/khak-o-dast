<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فراموشی رمز عبور | خاک و دست</title>
    <link rel="icon" type="image/svg+xml" href="./imges/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/webfont.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="auth-body">
    <!-- هدر ساده برای بازگشت -->
    <div class="breadcrumb-container" style="padding: 20px">
      <a href="login.html" class="back-home"> بازگشت به صفحه ورود</a>
    </div>

    <main class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>بازیابی رمز عبور</h1>
          <p>ایمیل خود را وارد کنید تا لینک تغییر رمز برایتان ارسال شود.</p>
        </div>

        <form class="form-group">
          <label for="email">ایمیل</label>
          <div class="input-group">
            <input
              type="email"
              id="email"
              class="auth-input"
              placeholder="example@email.com"
              required
            />
            <p class="error-message error-email hidden" id="email-error">
              ایمیل باید به صورت صحیح نوشته شود
            </p>
          </div>

          <button type="submit" id="submitBtn" class="auth-btn">
            ارسال لینک بازیابی
          </button>
        </form>
      </div>
    </main>

    <!-- ================= MODAL ================= -->
    <div class="modal-screen hidden" id="modalScreen">
      <div class="modal-content">
        <!-- آیکون موفقیت/خطا -->
        <img src="" alt="status" id="iconModalScreen" />

        <!-- متن پیغام -->
        <p class="modal-text" id="ModalText"></p>

        <!-- دکمه تایید -->
        <button class="modal-btn" id="modalButton">تایید</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/forgot-password.js"></script>
  </body>
</html>
