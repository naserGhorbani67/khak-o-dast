<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جزئیات محصول | خاک و دست</title>

    <!-- لینک‌های CSS و فونت‌های سایت شما -->
    <link rel="icon" type="image/svg+xml" href="./imges/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/webfont.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/product-detail.css" />
  </head>
  <body>
    <header class="nav">
      <div class="overlay" id="overlay"></div>
      <div class="nav-inner">
        <a href="#top" class="nav-logo" aria-label="خاک و دست">
          <span class="logo-words">
            <span class="khak">خاک</span>
            <svg
              class="mark"
              viewBox="0 0 24 34"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M9 4 C9 8 4 10.5 4 18.5 C4 26.5 8 31.5 12 31.5 C16 31.5 20 26.5 20 18.5 C20 10.5 15 8 15 4 Z"
                fill="#B24A2B"
              />
              <ellipse cx="12" cy="4" rx="3.3" ry="1.3" fill="#8E3A21" />
              <path
                d="M6 17 Q12 19.5 18 17"
                stroke="#E8A98C"
                stroke-width="1.1"
                stroke-linecap="round"
              />
              <path
                d="M5.6 22 Q12 24.8 18.4 22"
                stroke="#E8A98C"
                stroke-width="1.1"
                stroke-linecap="round"
              />
            </svg>
            <span class="dast">دست</span>
          </span>
          <svg
            class="swash"
            viewBox="0 0 200 14"
            preserveAspectRatio="none"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M2 4 Q50 0 100 4 T198 4"
              stroke="#B24A2B"
              stroke-width="2.2"
              stroke-linecap="round"
              vector-effect="non-scaling-stroke"
            />
            <path
              d="M22 8 Q70 4 110 8 T178 8"
              stroke="#B24A2B"
              stroke-width="1.6"
              stroke-linecap="round"
              opacity=".7"
              vector-effect="non-scaling-stroke"
            />
            <path
              d="M48 12 Q85 9 120 12 T152 12"
              stroke="#B24A2B"
              stroke-width="1.2"
              stroke-linecap="round"
              opacity=".45"
              vector-effect="non-scaling-stroke"
            />
          </svg>
        </a>
        <nav class="nav-links">
          <a href="index.html#top">خانه</a>
          <a href="index.html#about">درباره من</a>
          <a href="products.html">محصولات</a>
          <a href="index.html#contact">تماس با من</a>
          <a href="index.html#contact" class="mobile-order-btn">سفارش محصول</a>
        </nav>
        <div class="nav-actions">
          <!-- دکمه سفارش محصول -->
          <a href="#contact" class="nav-cta">سفارش محصول</a>
          <!--  آیکون سبد خرید  -->
          <a href="cart.html" class="cart-icon-wrapper" title="سبد خرید">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge" id="cartBadge" data-count="0">0</span>
          </a>
          <!-- بخش کاربری -->
          <div class="user-nav-container">
            <!-- حالت ۱: مهمان (ورود / ثبت نام) -->
            <div id="guest-view" class="guest-links">
              <a href="./login.html" class="nav-auth-link">ورود</a>
              <span class="divider">|</span>
              <a href="./signup.html" class="nav-auth-link">ثبت نام</a>
            </div>

            <!-- حالت ۲: کاربر لاگین شده (پروفایل و خروج) -->
            <div id="user-view" class="user-logged-in">
              <a href="profile.html" class="profile-dropdown">
                <i class="fa-regular fa-user"></i>
                <span id="user-name-display">نام کاربر</span>
              </a>
              <button id="logout-btn" title="خروج">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            </div>
          </div>

          <!-- دکمه منوی همبرگری -->
          <button class="nav-toggle" aria-label="باز کردن منو" id="navToggle">
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <div class="product-detail-breadcrumb-container wrap">
      <a href="index.html" class="back-home"> خانه </a>
      <span class="breadcrumb"> / </span>
      <a href="products.html" class="back-home"> محصولات </a>
      <span class="breadcrumb"> / </span>
      <span class="breadcrumb active-category" id="breadcrumbCategory"
        >دسته‌بندی</span
      >
    </div>
    <main class="product-detail-container" id="productDetailContainer">
      <!-- بخش گالری عکس (سمت راست در دسکتاپ) -->
      <div class="product-gallery">
        <div class="main-image">
          <img id="mainImage" src="" alt="تصویر اصلی محصول" />
        </div>
        <!-- بخش تصاویر کوچک (در حال حاضر خالی است) -->
        <div class="thumbnail-list" id="thumbnailList"></div>
      </div>

      <!-- بخش اطلاعات محصول (سمت چپ در دسکتاپ) -->

      <div class="product-info">
        <h1 class="product-title" id="productName">در حال بارگذاری...</h1>

        <div class="product-price-wrapper">
          <span class="product-price-large" id="productPrice">0</span>
          <span class="currency">تومان</span>
        </div>

        <p class="product-description" id="productDescription">
          در حال بارگذاری توضیحات...
        </p>

        <!-- بخش افزودن به سبد خرید -->
        <div class="purchase-actions">
          <div class="quantity-selector">
            <button id="decreaseQty" type="button">-</button>
            <span id="quantityDisplay">1</span>
            <button id="increaseQty" type="button">+</button>
          </div>

          <button class="add-to-cart-btn-large" id="addToCartBtn" type="button">
            <i class="fa-solid fa-cart-shopping"></i>
            افزودن به سبد خرید
          </button>
        </div>

        <!-- ویژگی‌های محصول -->
        <div class="product-features">
          <div class="feature-item">
            <i class="fa-solid fa-truck-fast"></i>
            <span>ارسال به سراسر کشور</span>
          </div>
          <div class="feature-item">
            <i class="fa-solid fa-hand-holding-heart"></i>
            <span>ساخته شده با عشق و دست</span>
          </div>
        </div>
      </div>
    </main>

    <!-- اسکریپت‌ها -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/product-detail.js"></script>
  </body>
</html>
